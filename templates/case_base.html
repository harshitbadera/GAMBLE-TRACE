<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07111f">
    <title>{% block title %}GambleTrace{% endblock %}</title>
    <style>
        :root { --bg:#07111f; --panel:#0f2138; --panel-2:#122942; --line:#25405e; --text:#eff7ff; --muted:#9eb4cc; --cyan:#36d9e8; --blue:#528bff; --green:#4fe39b; --amber:#ffc55a; --red:#ff6f7d; --purple:#b69bff; --shadow:0 18px 55px rgba(0,0,0,.25); }
        * { box-sizing:border-box; } body { margin:0; min-width:320px; background:radial-gradient(circle at 82% -8%, #163b62 0, transparent 28rem),radial-gradient(circle at -10% 27%,#102f4c 0,transparent 30rem),var(--bg); color:var(--text); font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
        a { color:inherit; text-decoration:none; } a:hover { color:var(--cyan); } button,input,select,textarea { font:inherit; } button { cursor:pointer; }
        .topbar { position:sticky; z-index:10; top:0; display:flex; align-items:center; justify-content:space-between; min-height:68px; padding:0 max(24px,calc((100vw - 1440px)/2)); border-bottom:1px solid rgba(91,139,187,.23); background:rgba(7,17,31,.87); backdrop-filter:blur(16px); } .brand { display:flex; align-items:center; gap:11px; font-weight:800; letter-spacing:.02em; } .brand-mark { display:grid; place-items:center; width:34px; height:34px; border:1px solid rgba(54,217,232,.6); border-radius:10px; color:var(--cyan); background:linear-gradient(145deg,#163b52,#0d1d32); box-shadow:0 0 22px rgba(54,217,232,.14); font-size:17px; } .brand small { display:block; color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.13em; } .topnav { display:flex; gap:6px; } .topnav a { padding:8px 11px; border-radius:8px; color:var(--muted); font-weight:650; } .topnav a:hover,.topnav a.active { color:var(--text); background:rgba(82,139,255,.14); }
        .shell { width:min(1440px,calc(100% - 48px)); margin:0 auto; padding:34px 0 58px; } .page-hero { display:flex; gap:24px; align-items:flex-end; justify-content:space-between; margin-bottom:24px; } .eyebrow { margin:0 0 6px; color:var(--cyan); font-weight:800; font-size:11px; letter-spacing:.14em; text-transform:uppercase; } h1,h2,h3,p { margin-top:0; } h1 { margin-bottom:7px; font-size:clamp(25px,4vw,36px); line-height:1.12; letter-spacing:-.035em; } h2 { margin-bottom:14px; font-size:17px; letter-spacing:-.01em; } h3 { margin-bottom:5px; font-size:14px; } .subtitle { margin:0; max-width:780px; color:var(--muted); }
        .button,.button-subtle,.button-danger { display:inline-flex; gap:7px; align-items:center; justify-content:center; min-height:37px; padding:8px 12px; border:1px solid transparent; border-radius:8px; color:#031520; background:var(--cyan); font-size:13px; font-weight:800; white-space:nowrap; } .button:hover { color:#031520; background:#77ebf3; } .button-subtle { color:var(--text); border-color:var(--line); background:rgba(17,40,66,.78); } .button-subtle:hover { color:var(--text); border-color:#3d6791; background:#183654; } .button-danger { color:#fff; background:#a93e50; } .button.small,.button-subtle.small { min-height:31px; padding:6px 9px; font-size:12px; }
        .card { border:1px solid rgba(74,111,146,.52); border-radius:14px; background:linear-gradient(150deg,rgba(18,41,66,.92),rgba(11,27,46,.94)); box-shadow:var(--shadow); } .card-pad { padding:19px; } .card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:15px; } .card-head p { margin:3px 0 0; color:var(--muted); font-size:12px; }
        .stat-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin-bottom:22px; } .stat { min-height:108px; padding:16px; border:1px solid rgba(74,111,146,.45); border-radius:12px; background:rgba(9,26,45,.73); } .stat-label { color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; } .stat-value { display:block; margin-top:12px; font-size:29px; font-weight:800; line-height:1; letter-spacing:-.04em; } .stat-note { margin-top:8px; color:var(--muted); font-size:12px; } .accent-cyan { color:var(--cyan); } .accent-green { color:var(--green); } .accent-amber { color:var(--amber); } .accent-red { color:var(--red); } .accent-purple { color:var(--purple); }
        .case-tabs { display:flex; gap:5px; overflow-x:auto; margin:-4px 0 22px; padding:4px; border:1px solid rgba(74,111,146,.42); border-radius:11px; background:rgba(8,24,42,.6); } .case-tabs a { flex:0 0 auto; padding:8px 11px; border-radius:7px; color:var(--muted); font-weight:750; font-size:12px; } .case-tabs a:hover,.case-tabs a.active { color:var(--text); background:rgba(82,139,255,.18); }
        .layout-2 { display:grid; grid-template-columns:minmax(0,1.8fr) minmax(285px,.9fr); gap:18px; } .layout-2-even { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; } .stack { display:grid; gap:18px; } .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:9px; } .toolbar form { display:contents; }
        .notice { margin-bottom:19px; padding:11px 13px; border:1px solid rgba(54,217,232,.45); border-radius:9px; color:#d9fbff; background:rgba(27,111,127,.17); } .error { border-color:rgba(255,111,125,.45); color:#ffdce0; background:rgba(139,40,58,.2); }
        .chip { display:inline-flex; align-items:center; gap:5px; max-width:100%; padding:3px 8px; border:1px solid rgba(96,137,175,.48); border-radius:99px; color:#cfe1f2; background:rgba(37,64,94,.42); font-size:11px; font-weight:750; vertical-align:middle; } .chip.high { color:#ffd4d8; border-color:rgba(255,111,125,.48); background:rgba(172,54,70,.2); } .chip.medium { color:#ffe8b9; border-color:rgba(255,197,90,.45); background:rgba(168,108,14,.18); } .chip.low,.chip.active { color:#cbffe8; border-color:rgba(79,227,155,.42); background:rgba(23,137,88,.16); } .chip.closed { color:#d7d9e1; } .chip.info { color:#d9faff; border-color:rgba(54,217,232,.4); background:rgba(26,125,143,.16); }
        .table-wrap { overflow-x:auto; } table { width:100%; border-collapse:collapse; } th { padding:0 10px 10px; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.1em; text-align:left; text-transform:uppercase; white-space:nowrap; } td { padding:12px 10px; border-top:1px solid rgba(74,111,146,.32); vertical-align:top; } tr:hover td { background:rgba(40,77,112,.12); } .domain-link { color:#eaf7ff; font-weight:800; } .secondary { display:block; margin-top:3px; color:var(--muted); font-size:11px; }
        label { display:block; margin-bottom:6px; color:#c8dbed; font-size:12px; font-weight:750; } input,select,textarea { width:100%; padding:9px 10px; border:1px solid #315577; border-radius:8px; outline:0; color:var(--text); background:rgba(4,15,28,.68); } input:focus,select:focus,textarea:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(54,217,232,.12); } textarea { min-height:88px; resize:vertical; } input[type="checkbox"] { width:auto; accent-color:var(--cyan); } .field { margin-bottom:13px; } .form-row { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; } .hint { margin:5px 0 0; color:var(--muted); font-size:11px; }
        .empty { padding:31px 18px; border:1px dashed #315577; border-radius:11px; color:var(--muted); text-align:center; } .empty strong { display:block; margin-bottom:5px; color:var(--text); } .list { margin:0; padding:0; list-style:none; } .list > li { padding:11px 0; border-top:1px solid rgba(74,111,146,.31); } .list > li:first-child { padding-top:0; border-top:0; }
        .key-value { display:grid; grid-template-columns:138px minmax(0,1fr); gap:7px 12px; } .key-value dt { color:var(--muted); font-size:12px; } .key-value dd { margin:0; overflow-wrap:anywhere; color:#e7f3fd; } .mono { overflow-wrap:anywhere; font:11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; }
        .timeline { position:relative; margin:0; padding:0 0 0 19px; list-style:none; } .timeline::before { position:absolute; top:5px; bottom:5px; left:4px; width:1px; background:#315577; content:""; } .timeline li { position:relative; padding:0 0 18px 13px; } .timeline li::before { position:absolute; top:4px; left:-19px; width:8px; height:8px; border:2px solid var(--cyan); border-radius:50%; background:var(--bg); content:""; } .timeline time { display:block; margin-bottom:3px; color:var(--muted); font-size:11px; } .timeline p { margin:3px 0 0; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
        details { border-top:1px solid rgba(74,111,146,.38); } details summary { padding:12px 0; color:#d8e9fa; font-weight:800; cursor:pointer; } details > div { padding:0 0 14px; } .check-row { display:flex; flex-wrap:wrap; gap:9px 15px; } .check-row label { display:flex; align-items:center; gap:6px; margin:0; font-weight:600; }
        .cluster-members { display:grid; gap:10px; } .member { display:flex; justify-content:space-between; gap:13px; padding:12px; border:1px solid rgba(74,111,146,.38); border-radius:10px; background:rgba(7,20,35,.47); } .member p { margin:4px 0 0; color:var(--muted); font-size:12px; } .artifact-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; } .artifact { display:flex; min-height:145px; flex-direction:column; justify-content:space-between; padding:14px; border:1px solid rgba(74,111,146,.42); border-radius:10px; background:rgba(7,20,35,.5); } .artifact h3 { overflow-wrap:anywhere; } .artifact .mono { color:var(--muted); }
        .breadcrumbs { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; color:var(--muted); font-size:12px; } .breadcrumbs span { color:#54718f; } .muted { color:var(--muted); } .right { text-align:right; } .nowrap { white-space:nowrap; } .mt-12 { margin-top:12px; } .mb-0 { margin-bottom:0; }
        @media (max-width:900px) { .stat-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } .layout-2,.layout-2-even { grid-template-columns:1fr; } } @media (max-width:620px) { .topbar { min-height:60px; padding:0 16px; } .brand small,.topnav a:not(:first-child) { display:none; } .shell { width:min(100% - 28px,1440px); padding-top:23px; } .page-hero { align-items:flex-start; flex-direction:column; gap:13px; } .stat-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .stat { min-height:92px; } .form-row { grid-template-columns:1fr; } .key-value { grid-template-columns:1fr; gap:2px; } .key-value dd { margin-bottom:8px; } }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('cases.case_list') }}"><span class="brand-mark">⌁</span><span>GambleTrace<small>Evidence-led investigation</small></span></a>
        <nav class="topnav" aria-label="Primary navigation"><a class="{% if request.endpoint in ['cases.case_list', 'cases.new_case'] %}active{% endif %}" href="{{ url_for('cases.case_list') }}">Cases</a><a href="{{ url_for('dashboard.index') }}">Legacy tools</a></nav>
    </header>
    <main class="shell">{% block content %}{% endblock %}</main>
    <script>
        (() => { const token = "{{ csrf_token() }}"; document.querySelectorAll('form[method="post"], form[method="POST"]').forEach(form => { if (!form.querySelector('input[name="csrf_token"]')) { const input=document.createElement('input'); input.type='hidden'; input.name='csrf_token'; input.value=token; form.append(input); } }); window.GambleTraceCsrfToken=token; })();
    </script>
</body>
</html>
